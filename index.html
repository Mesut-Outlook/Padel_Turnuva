<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" content="#0e0f0c">
    <title>Padel Bireysel Mexicano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0f0c; --card: #1a1b18; --raised: #262722; --input: #151613; --btn2: #2e2f29;
            --line: #34352f; --line-soft: #262722;
            --text: #f4f4ef; --text-2: #e6e6df; --text-3: #c9c9c2; --muted: #a3a39a; --dim: #8a8a80;
            --lime: #d7f34a; --lime-bg: #23280e; --lime-line: #4d5a14;
            --gold: #f2c14e; --gold-bg: #2e2410; --gold-line: #6b5317;
            --silver-line: #3d3e39;
            --bronze: #e0a370; --bronze-bg: #2a1d12; --bronze-line: #6e4625;
            --red: #ff8a7a; --red-bg: #2e1512; --red-line: #7a2a22;
            color-scheme: dark;
        }
        html { font-size: 16px; }
        /* Büyük yazı modu: tüm ölçüler rem olduğu için kök boyutu büyütmek yeterli */
        html.large-text { font-size: 19px; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, .display { font-family: Outfit, sans-serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        button, input { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; }
        input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
        svg { flex-shrink: 0; }

        .wrap { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1.25rem 2.5rem; display: flex; flex-direction: column; gap: 1.4rem; }
        .stack { display: flex; flex-direction: column; gap: 0.625rem; }
        .row { display: flex; align-items: center; gap: 0.625rem; }
        .grow { flex-grow: 1; min-width: 0; }
        .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
        .muted { color: var(--muted); }
        .eyebrow { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
        .title { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; }
        .section-title { font-size: 0.94rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
        .sub { font-size: 0.8rem; color: var(--muted); }
        .center { text-align: center; }

        .btn { min-height: 3.5rem; border: 0; border-radius: 1rem; font-weight: 800; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0 1.1rem; width: 100%; }
        .btn-sm { min-height: 3rem; border-radius: 0.875rem; font-size: 0.94rem; font-weight: 700; }
        .btn-primary { background: var(--lime); color: var(--bg); }
        .btn-secondary { background: var(--btn2); color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text-2); }
        .btn-danger { background: transparent; border: 1px solid var(--red-line); color: var(--red); }
        .btn-disabled, .btn:disabled { background: var(--raised); color: var(--muted); cursor: default; }
        .link-danger { background: none; border: 0; color: var(--red); font-weight: 700; font-size: 0.875rem; min-height: 2.75rem; padding: 0 0.75rem; align-self: center; }
        .icon-btn { width: 2.75rem; height: 2.75rem; flex-shrink: 0; border-radius: 0.75rem; background: var(--raised); border: 0; color: var(--text-2); display: flex; align-items: center; justify-content: center; }

        .card { border-radius: 1.25rem; border: 1px solid var(--line-soft); background: var(--card); padding: 1.1rem; display: flex; flex-direction: column; gap: 0.875rem; }
        .card-strong { border-color: var(--line); }
        .pill { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.625rem; border-radius: 999px; white-space: nowrap; border: 1px solid; display: inline-flex; align-items: center; gap: 0.375rem; }
        .pill-lime { color: var(--lime); background: var(--lime-bg); border-color: var(--lime-line); }
        .pill-gold { color: var(--gold); background: var(--gold-bg); border-color: var(--gold-line); }
        .pill-grey { color: var(--muted); background: var(--raised); border-color: var(--line); }
        .dot { width: 0.45rem; height: 0.45rem; border-radius: 999px; background: currentColor; }
        .meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; font-size: 0.875rem; color: var(--text-3); }
        .meta span { display: flex; align-items: center; gap: 0.375rem; }
        .meta svg { color: var(--lime); }
        .tags { display: flex; flex-wrap: wrap; gap: 0.375rem; }
        .tag { font-size: 0.8rem; font-weight: 600; color: var(--text); background: var(--raised); border: 1px solid var(--line); padding: 0.3rem 0.625rem; border-radius: 999px; }

        .list-item { border-radius: 1.1rem; border: 1px solid var(--line-soft); background: var(--card); padding: 1rem; display: flex; align-items: center; gap: 0.875rem; }
        .list-icon { width: 3rem; height: 3rem; flex-shrink: 0; border-radius: 0.875rem; display: flex; align-items: center; justify-content: center; background: var(--raised); color: var(--muted); }
        .list-icon.gold { background: var(--gold-bg); border: 1px solid var(--gold-line); color: var(--gold); }
        .list-name { font-weight: 700; font-size: 1rem; }
        .champ { font-size: 0.8rem; font-weight: 700; color: var(--gold); }

        /* Form */
        .field { display: flex; flex-direction: column; gap: 0.5rem; }
        .label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
        .input { min-height: 3.125rem; width: 100%; border-radius: 0.875rem; border: 1px solid var(--line); background: var(--input); color: var(--text); padding: 0 0.875rem; font-size: 1rem; font-weight: 600; }
        .input::placeholder { color: var(--dim); font-weight: 500; }
        .input-dashed { border-style: dashed; background: transparent; min-height: 2.75rem; font-size: 0.875rem; }
        .stepper { display: flex; align-items: center; gap: 0.25rem; background: var(--input); border: 1px solid var(--line); border-radius: 0.875rem; padding: 0.25rem; }
        .stepper button { width: 2.75rem; height: 2.5rem; border: 0; border-radius: 0.625rem; background: var(--raised); color: var(--text-2); display: flex; align-items: center; justify-content: center; }
        .stepper span { min-width: 2.25rem; text-align: center; font-family: Outfit, sans-serif; font-size: 1.25rem; font-weight: 800; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .chip { min-height: 2.75rem; border-radius: 999px; padding: 0 1rem; font-size: 0.94rem; font-weight: 700; display: flex; align-items: center; gap: 0.375rem; border: 1px solid var(--line); background: transparent; color: var(--text-3); }
        .chip.on { border-color: var(--lime); background: var(--lime); color: var(--bg); }
        .chip-soft { align-self: flex-start; min-height: 2.25rem; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--text-2); font-size: 0.8rem; font-weight: 700; padding: 0 0.875rem; display: flex; align-items: center; gap: 0.375rem; }
        .text-btn { background: none; border: 0; color: var(--lime); font-size: 0.8rem; font-weight: 700; min-height: 2.25rem; padding: 0 0.25rem; }
        .hint { display: flex; gap: 0.625rem; align-items: flex-start; border-radius: 0.875rem; padding: 0.75rem 0.875rem; font-size: 0.875rem; font-weight: 600; line-height: 1.45; border: 1px solid; }
        .hint-ok { background: var(--lime-bg); border-color: var(--lime-line); color: var(--lime); }
        .hint-warn { background: var(--gold-bg); border-color: var(--gold-line); color: var(--gold); }
        .hint-err { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }
        .pool-row { display: flex; gap: 0.5rem; align-items: center; }

        /* Sıralama */
        .board { border-radius: 1.1rem; border: 1px solid var(--line-soft); background: var(--card); overflow: hidden; }
        .board-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem; }
        .board-row + .board-row { border-top: 1px solid var(--line-soft); }
        .rank { width: 1.75rem; height: 1.75rem; flex-shrink: 0; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; background: var(--raised); color: var(--muted); }
        .rank-1 { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-line); }
        .rank-2 { color: var(--text-2); border: 1px solid var(--silver-line); }
        .rank-3 { background: var(--bronze-bg); color: var(--bronze); border: 1px solid var(--bronze-line); }
        .board-name { flex-grow: 1; font-weight: 600; font-size: 0.94rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delta { font-size: 0.75rem; font-weight: 800; color: var(--lime); }
        .board-pts { min-width: 4.75rem; text-align: right; font-family: Outfit, sans-serif; font-weight: 800; font-size: 1rem; }

        /* Maç kartı */
        .match { border-radius: 1.1rem; border: 1px solid var(--line); background: var(--card); padding: 0.875rem; display: flex; flex-direction: column; gap: 0.625rem; }
        .court { font-size: 0.75rem; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
        .team { display: flex; align-items: center; gap: 0.75rem; }
        .team-names { font-size: 1rem; font-weight: 700; }
        .team-won-label { display: none; font-size: 0.75rem; font-weight: 700; color: var(--lime); }
        .team.won .team-names { color: var(--lime); }
        .team.won .team-won-label { display: block; }
        .team.lost .team-names { color: var(--muted); }
        .score { width: 4.5rem; height: 3.5rem; border-radius: 0.875rem; text-align: center; font-family: Outfit, sans-serif; font-size: 1.6rem; font-weight: 800; background: var(--input); color: var(--text); border: 1px solid var(--line); padding: 0; }
        .score::placeholder { color: var(--dim); }
        .team.won .score { background: var(--lime); color: var(--bg); border-color: var(--lime); }
        .match-note { font-size: 0.8rem; font-weight: 600; }
        .match-note:empty { display: none; }
        .match-note.err { color: var(--red); }
        .match-note.tb { color: var(--gold); }
        .resting { font-size: 0.8rem; color: var(--muted); }
        details.round { border-radius: 0.875rem; border: 1px solid var(--line-soft); background: var(--card); }
        details.round > summary { list-style: none; min-height: 3rem; padding: 0 0.875rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.875rem; font-weight: 600; color: var(--text-2); cursor: pointer; }
        details.round > summary::-webkit-details-marker { display: none; }
        details.round > summary .muted { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
        details.round[open] > summary svg { transform: rotate(180deg); }
        details.round > .round-body { padding: 0 0.625rem 0.625rem; display: flex; flex-direction: column; gap: 0.625rem; }
        details.round .match { background: var(--input); }

        /* Özet */
        .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; align-items: end; }
        .podium-col { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; min-width: 0; }
        .podium-name { font-weight: 700; font-size: 0.94rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .podium-block { width: 100%; border-radius: 0.875rem 0.875rem 0.375rem 0.375rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.125rem; border: 1px solid; }
        .podium-block .display { font-weight: 800; }
        .podium-block small { font-size: 0.8rem; font-weight: 700; }
        .p1 .podium-block { height: 8rem; background: var(--gold-bg); border-color: var(--gold-line); color: var(--gold); }
        .p1 .podium-block .display { font-size: 2.1rem; }
        .p1 .podium-name { color: var(--gold); font-weight: 800; font-size: 1rem; }
        .p2 .podium-block { height: 6rem; background: var(--raised); border-color: var(--silver-line); color: var(--text-3); }
        .p2 .podium-block .display { font-size: 1.75rem; }
        .p3 .podium-block { height: 4.75rem; background: var(--bronze-bg); border-color: var(--bronze-line); color: var(--bronze); }
        .p3 .podium-block .display { font-size: 1.5rem; }
        .result-round { border-radius: 1rem; border: 1px solid var(--line-soft); background: var(--card); padding: 0.75rem 0.875rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .result-round-title { font-size: 0.75rem; font-weight: 800; color: var(--lime); letter-spacing: 0.06em; }
        .result-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 0.5rem; align-items: center; font-size: 0.8rem; }
        .result-line .l { text-align: right; }
        .result-line .w { font-weight: 700; color: var(--lime); }
        .result-line .x { font-weight: 500; color: var(--muted); }
        .result-score { font-family: Outfit, sans-serif; font-weight: 800; font-size: 0.94rem; background: var(--raised); border-radius: 0.5rem; padding: 0.2rem 0.5rem; white-space: nowrap; }

        /* Menü, toast, modal */
        .menu { position: relative; }
        .menu-pop { position: absolute; right: 0; top: 3.25rem; z-index: 10; min-width: 13rem; background: var(--raised); border: 1px solid var(--line); border-radius: 1rem; padding: 0.375rem; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
        .menu-pop a, .menu-pop button { min-height: 2.75rem; display: flex; align-items: center; gap: 0.625rem; padding: 0 0.75rem; border-radius: 0.625rem; background: none; border: 0; color: var(--text); font-weight: 600; font-size: 0.94rem; text-align: left; }
        .menu-pop a:hover, .menu-pop button:hover { background: var(--btn2); }
        .menu-pop .danger { color: var(--red); }
        #toast { position: fixed; left: 50%; top: 1rem; transform: translate(-50%, calc(-100% - 2rem)); z-index: 50; max-width: calc(100% - 2rem); background: var(--text); color: var(--bg); font-weight: 700; font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: 0.875rem; transition: transform 0.25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        #toast.show { transform: translate(-50%, 0); }
        dialog { border: 1px solid var(--line); border-radius: 1.25rem; background: var(--card); color: var(--text); padding: 1.5rem; width: min(22rem, calc(100% - 2rem)); }
        dialog::backdrop { background: rgba(0,0,0,0.7); }
        dialog h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
        dialog p { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
        details.rules { font-size: 0.875rem; color: var(--muted); line-height: 1.55; }
        details.rules summary { cursor: pointer; font-weight: 700; color: var(--text-2); min-height: 2.75rem; display: flex; align-items: center; }
        details.rules strong { color: var(--text); }
        .empty { border: 1px dashed var(--line); border-radius: 1.1rem; padding: 1.25rem; text-align: center; color: var(--muted); font-size: 0.875rem; }
    </style>
</head>
<body>
    <div id="toast" role="status" aria-live="polite"></div>
    <main id="app"><div class="wrap"><p class="muted center">Yükleniyor…</p></div></main>

    <dialog id="confirmDialog">
        <h3 id="confirmTitle"></h3>
        <p id="confirmDesc"></p>
        <div class="grid2">
            <button type="button" class="btn btn-sm btn-ghost" data-close="0">İptal</button>
            <button type="button" class="btn btn-sm btn-primary" id="confirmOk" data-close="1"></button>
        </div>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Firebase Console → Proje ayarları → Web uygulaması → firebaseConfig (boşsa yerel modda çalışır)
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let tourneyDocRef = null;
        let unsubscribe = null;
        let isOfflineMode = true;
        let data = null;

        // Varsayılan İlk Katılımcı Listesi
        const initialPlayers = [
            { id: "p1", name: "Zafer" },
            { id: "p2", name: "Mesut" },
            { id: "p3", name: "Bihter" },
            { id: "p4", name: "Okan" },
            { id: "p5", name: "Fırat" },
            { id: "p6", name: "Burcu" },
            { id: "p7", name: "Murat ÇALIŞAL" },
            { id: "p8", name: "Serhat" }
        ];

        const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
        const DAYS = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
        const PLACEHOLDER_COURTS = ['Kort 1 & 2', 'Kort Belirtilmedi'];

        const $app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const pad = n => String(n).padStart(2, '0');
        const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

        const ICON = {
            plus: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
            minus: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>',
            back: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
            next: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
            down: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
            cal: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
            court: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h18"/></svg>',
            users: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.5c2 .4 3.4 2 4 4.5"/></svg>',
            pin: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
            trophy: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
            clock: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
            check: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
            info: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
            redo: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
            dots: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
            copy: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
            x: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
        };

        // ==========================================
        // Yardımcılar
        // ==========================================
        let toastTimer;
        function showToast(message) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
        }

        const confirmDialog = document.getElementById('confirmDialog');
        function askConfirm(title, desc, okLabel, danger = false) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmDesc').textContent = desc;
            const ok = document.getElementById('confirmOk');
            ok.textContent = okLabel;
            ok.className = `btn btn-sm ${danger ? 'btn-danger' : 'btn-primary'}`;
            confirmDialog.showModal();
            return new Promise(resolve => {
                confirmDialog.onclick = e => {
                    const v = e.target.closest('[data-close]')?.dataset.close;
                    if (v !== undefined) { confirmDialog.close(); resolve(v === '1'); }
                };
                confirmDialog.oncancel = () => resolve(false);
            });
        }

        function backupDataLocally(d) {
            try { localStorage.setItem('padel_mexicano_backup', JSON.stringify(d)); } catch (e) { console.error("Yerel kayıt başarısız"); }
        }

        async function save() {
            backupDataLocally(data);
            if (isOfflineMode || !tourneyDocRef) return;
            try {
                await setDoc(tourneyDocRef, data);
            } catch (e) {
                console.error("Kayıt hatası:", e);
                showToast("Buluta kaydedilemedi, yerel modda devam ediliyor.");
                goOffline();
            }
        }

        // Büyük Yazı / Kolay Okuma Modu
        let isEasyReadingActive = localStorage.getItem('padel_easy_reading_mode') === 'true';
        function applyEasyReadingMode(isActive) {
            document.documentElement.classList.toggle('large-text', isActive);
        }
        applyEasyReadingMode(isEasyReadingActive);

        // Eski "11 Ekim 2026 - 18:00" metnini tarih/saat alanlarına çevir
        function parseOldTime(str) {
            const m = /(\d{1,2})\s+(\S+)\s+(\d{4})(?:\s*-\s*(\d{1,2}:\d{2}))?/.exec(str || '');
            if (!m) return null;
            const mi = MONTHS.indexOf(m[2]);
            if (mi < 0) return null;
            return { date: `${m[3]}-${pad(mi + 1)}-${pad(m[1])}`, startTime: m[4] || '' };
        }

        // Veri Yapısını Yeni Formata Dönüştürme/Migrasyon
        function migrateOldData(oldData) {
            if (oldData && oldData.rounds && !oldData.tournaments) {
                // Eski tek turnuvalı yapıyı çoklu turnuva yapısına dönüştür
                const oldPlayers = oldData.players || initialPlayers.map(p => ({ ...p, score: 0 }));
                const pool = oldPlayers.map(p => ({ id: p.id, name: p.name }));
                oldData = {
                    playersPool: pool,
                    tournaments: [{
                        id: "default-tourney", name: "Ana Turnuva", court: "", courtCount: 2, courtNames: [],
                        time: "Belirtilmedi", activePlayerIds: pool.map(p => p.id), rounds: oldData.rounds || [],
                        createdAt: Date.now() - 2000, isFinished: false
                    }],
                    currentTournamentId: "default-tourney"
                };
            }

            if (oldData && oldData.tournaments && oldData.playersPool) {
                oldData.tournaments.forEach(t => {
                    if (t.courtCount === undefined) t.courtCount = 2;
                    if (t.courtNames === undefined) t.courtNames = [];
                    if (t.isFinished === undefined) t.isFinished = false;
                    if (!t.rounds) t.rounds = [];
                    if (!t.activePlayerIds) t.activePlayerIds = [];
                    if (t.createdAt === undefined) {
                        const ts = t.id && t.id.startsWith('t_') ? parseInt(t.id.replace('t_', '')) : NaN;
                        t.createdAt = !isNaN(ts) ? ts : Date.now() - 3000;
                    }
                    if (t.date === undefined) {
                        const p = parseOldTime(t.time);
                        t.date = p ? p.date : '';
                        t.startTime = p ? p.startTime : '';
                    }
                    if (t.startTime === undefined) t.startTime = '';
                });
                return oldData;
            }

            // Varsayılan State Oluştur
            const today = new Date();
            return {
                playersPool: [...initialPlayers],
                tournaments: [{
                    id: "t1", name: `${MONTHS[today.getMonth()]} Turnuvası`, court: "", courtCount: 2, courtNames: [],
                    date: isoDate(today), startTime: "18:00", time: "",
                    activePlayerIds: initialPlayers.map(p => p.id), rounds: [], createdAt: Date.now() - 1000, isFinished: false
                }],
                currentTournamentId: "t1"
            };
        }

        const getTourney = id => data.tournaments.find(t => t.id === id);
        const playerName = (id, fallback) => data.playersPool.find(p => p.id === id)?.name || fallback || "Silinmiş Oyuncu";
        const facility = t => (t.court && !PLACEHOLDER_COURTS.includes(t.court)) ? t.court : '';

        function fmtWhen(t, withTime = true) {
            if (!t.date) return t.time || '';
            const d = parseIso(t.date);
            return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` + (withTime && t.startTime ? ` · ${t.startTime}` : '');
        }

        function legacyTimeString(date, startTime) {
            if (!date) return '';
            const d = parseIso(date);
            return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` + (startTime ? ` - ${startTime}` : '');
        }

        // ==========================================
        // Puanlama
        // ==========================================
        const num = v => (v === null || v === undefined || v === '') ? null : parseInt(v, 10);
        const pts = s => s >= 24 ? s + 5 : s;

        // null = skor girilmemiş, invalid = kurala aykırı (ya ikisi 24 ya hiçbiri)
        function matchResult(m) {
            const a = num(m.score1), b = num(m.score2);
            if (a === null || b === null || isNaN(a) || isNaN(b)) return null;
            if ((a === 24) === (b === 24)) return { invalid: true, a, b };
            return { a, b };
        }

        function standings(t) {
            const map = new Map(t.activePlayerIds.map(id => [id, { id, name: playerName(id), score: 0, played: 0, delta: 0 }]));
            const last = t.rounds.length - 1;
            t.rounds.forEach((round, ri) => round.matches.forEach(m => {
                const res = matchResult(m);
                if (!res || res.invalid) return;
                [[m.t1p1, m.t1p2, res.a], [m.t2p1, m.t2p2, res.b]].forEach(([p, q, s]) => [p, q].forEach(pl => {
                    let e = map.get(pl.id);
                    if (!e) { e = { id: pl.id, name: playerName(pl.id, pl.name), score: 0, played: 0, delta: 0 }; map.set(pl.id, e); }
                    e.score += pts(s);
                    e.played++;
                    if (ri === last) e.delta += pts(s);
                }));
            }));
            return [...map.values()].sort((a, b) => b.score - a.score);
        }

        const roundComplete = round => round.matches.every(m => { const r = matchResult(m); return r && !r.invalid; });

        // Mexicano eşleştirmesi
        function generateRound(t) {
            // Her oyuncunun oynadığı maç sayısı
            const playCounts = {};
            t.activePlayerIds.forEach(id => playCounts[id] = 0);
            t.rounds.forEach(r => r.matches.forEach(m => [m.t1p1, m.t1p2, m.t2p1, m.t2p2].forEach(p => {
                if (p.id in playCounts) playCounts[p.id]++;
            })));
            const scoreOf = {};
            standings(t).forEach(s => scoreOf[s.id] = s.score);

            const allActivePlayers = t.activePlayerIds.map(id => ({ id, name: playerName(id), score: scoreOf[id] || 0, playCount: playCounts[id] }));

            // Adil seçim için önce listeyi rastgele karıştıralım
            for (let i = allActivePlayers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allActivePlayers[i], allActivePlayers[j]] = [allActivePlayers[j], allActivePlayers[i]];
            }

            // 1. playCount (küçük olan öncelikli), 2. score (büyük olan öncelikli)
            allActivePlayers.sort((a, b) => a.playCount !== b.playCount ? a.playCount - b.playCount : b.score - a.score);

            const courtCount = parseInt(t.courtCount) || 2;
            const maxMatches = Math.min(courtCount, Math.floor(allActivePlayers.length / 4));
            const selectedPlayers = allActivePlayers.slice(0, maxMatches * 4);

            // Oynayacak oyuncuları puana göre azalan sırada sıralayalım
            selectedPlayers.sort((a, b) => b.score - a.score);

            // Mexicano Eşleştirmesi (rakip = sıralamada en yakın takım):
            // Takımlar: #1+#N, #2+#(N-1), ... ; ardışık iki takım aynı sahada.
            // Örnek (8 oyuncu, 2 saha):
            //   Saha 1: [#1 + #8] vs [#2 + #7]
            //   Saha 2: [#3 + #6] vs [#4 + #5]
            const definedCourts = t.courtNames || [];
            const newMatches = [];
            const N = selectedPlayers.length;
            for (let k = 0; k < maxMatches; k++) {
                const a = selectedPlayers[2 * k];              // takım 1 üst
                const b = selectedPlayers[N - 1 - 2 * k];      // takım 1 alt
                const c = selectedPlayers[2 * k + 1];          // takım 2 üst
                const d = selectedPlayers[N - 2 - 2 * k];      // takım 2 alt

                const cName = definedCourts[k];
                const matchCourt = cName ? (/^\d+$/.test(cName) ? `Saha ${cName}` : cName) : `Kort ${k + 1}`;

                newMatches.push({
                    t1p1: { id: a.id, name: a.name }, t1p2: { id: b.id, name: b.name },
                    t2p1: { id: c.id, name: c.name }, t2p2: { id: d.id, name: d.name },
                    score1: null, score2: null, court: matchCourt
                });
            }
            t.rounds.push({ matches: newMatches });
        }

        // ==========================================
        // Yönlendirme ve görünüm durumu
        // ==========================================
        let view = { name: 'list' };
        let form = null;
        let menuOpen = false;
        const openRounds = new Set();

        function route() {
            const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
            menuOpen = false;
            openRounds.clear();
            if (parts[0] === 'yeni') {
                view = { name: 'form' };
                form = makeForm(null, parts[1] === 'kopya' ? parts[2] : null);
            } else if (parts[0] === 'duzenle' && parts[1]) {
                view = { name: 'form', editId: parts[1] };
                form = makeForm(parts[1], null);
            } else if (parts[0] === 't' && parts[1]) {
                view = { name: 'tourney', id: parts[1] };
                if (data && getTourney(parts[1])) data.currentTournamentId = parts[1];
            } else {
                view = { name: 'list' };
            }
            render();
            paintAll();
            window.scrollTo(0, 0);
        }

        function render() {
            if (!data) return;
            if (view.name === 'form' && !form) form = makeForm(view.editId || null, null);

            // Yeniden çizimde odak ve imleç konumunu koru
            const ae = document.activeElement;
            const focusId = ae && ae.id;
            let sel = null;
            try { sel = ae && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null; } catch (e) { }

            $app.innerHTML = view.name === 'form' ? renderForm() : view.name === 'tourney' ? renderTourney() : renderList();

            if (focusId) {
                const el = document.getElementById(focusId);
                if (el) {
                    el.focus({ preventScroll: true });
                    try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) { }
                }
            }
        }

        const statusPill = () => isOfflineMode
            ? '<span class="pill pill-grey"><span class="dot"></span>Yerel</span>'
            : '<span class="pill pill-lime"><span class="dot"></span>Canlı</span>';

        // ==========================================
        // 1 · Turnuvalar listesi
        // ==========================================
        function tourneyPill(t) {
            if (t.rounds.length) return `<span class="pill pill-lime">${t.rounds.length}. tur</span>`;
            if (!t.date) return '';
            const today = isoDate(new Date());
            const tomorrow = isoDate(new Date(Date.now() + 864e5));
            if (t.date === today) return '<span class="pill pill-gold">Bugün</span>';
            if (t.date === tomorrow) return '<span class="pill pill-gold">Yarın</span>';
            return '';
        }

        function metaRow(t) {
            const parts = [];
            const when = fmtWhen(t);
            if (when) parts.push(`<span>${ICON.cal}${esc(when)}</span>`);
            parts.push(`<span>${ICON.court}${parseInt(t.courtCount) || 2} saha</span>`);
            parts.push(`<span>${ICON.users}${t.activePlayerIds.length} oyuncu</span>`);
            if (facility(t)) parts.push(`<span>${ICON.pin}${esc(facility(t))}</span>`);
            return `<div class="meta">${parts.join('')}</div>`;
        }

        function renderList() {
            const today = isoDate(new Date());
            const byNewest = [...data.tournaments].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            // Hiç oynanmamış ve tarihi geçmiş turnuvalar da geçmişte görünür
            const isActive = t => !t.isFinished && (t.rounds.length > 0 || !t.date || t.date >= today);
            const active = byNewest.filter(isActive);
            const past = byNewest.filter(t => !isActive(t));

            const activeHtml = active.length ? active.map(t => `
                <div class="card card-strong">
                    <div class="row" style="justify-content:space-between">
                        <h2 class="display" style="font-size:1.4rem;font-weight:800">${esc(t.name)}</h2>
                        ${tourneyPill(t)}
                    </div>
                    ${metaRow(t)}
                    <div class="tags">${t.activePlayerIds.map(id => `<span class="tag">${esc(playerName(id))}</span>`).join('')}</div>
                    <a class="btn btn-sm btn-secondary" href="#/t/${esc(t.id)}">Turnuvaya Git ${ICON.next}</a>
                </div>`).join('') : '<div class="empty">Aktif turnuva yok. Yukarıdan yeni bir turnuva oluştur.</div>';

            const pastHtml = past.map(t => {
                const top = t.rounds.length ? standings(t)[0] : null;
                const played = top && top.score > 0;
                const info = [fmtWhen(t, false), played ? `${t.rounds.length} tur` : 'oynanmadı', played ? `${t.activePlayerIds.length} oyuncu` : ''].filter(Boolean).join(' · ');
                return `
                <a class="list-item" href="#/t/${esc(t.id)}">
                    <div class="list-icon ${played ? 'gold' : ''}">${played ? ICON.trophy : ICON.clock}</div>
                    <div class="grow stack" style="gap:0.2rem">
                        <span class="list-name">${esc(t.name)}</span>
                        <span class="sub">${esc(info)}</span>
                        ${played ? `<span class="champ">Şampiyon: ${esc(top.name)} · ${top.score} puan</span>` : ''}
                    </div>
                    <span class="muted">${ICON.next}</span>
                </a>`;
            }).join('');

            return `
            <div class="wrap">
                <div class="row" style="align-items:flex-start">
                    <div class="grow stack" style="gap:0.25rem">
                        <span class="eyebrow">PADEL BİREYSEL MEXICANO</span>
                        <h1 class="title">Turnuvalar</h1>
                    </div>
                    <button type="button" class="chip-soft" data-action="toggle-large" aria-pressed="${isEasyReadingActive}">${isEasyReadingActive ? 'Normal yazı' : 'Büyük yazı'}</button>
                </div>
                <a class="btn btn-primary" href="#/yeni">${ICON.plus} Yeni Turnuva Oluştur</a>
                <section class="stack">
                    <h2 class="section-title">AKTİF</h2>
                    ${activeHtml}
                </section>
                ${past.length ? `<section class="stack"><h2 class="section-title">GEÇMİŞ TURNUVALAR</h2>${pastHtml}</section>` : ''}
                <div class="center">${statusPill()}</div>
            </div>`;
        }

        // ==========================================
        // 2 · Yeni turnuva / düzenleme formu
        // ==========================================
        function latestRoster() {
            const latest = [...data.tournaments].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
            return latest ? latest.activePlayerIds.slice() : [];
        }

        function makeForm(editId, copyFromId) {
            if (!data) return null;
            const src = editId ? getTourney(editId) : copyFromId ? getTourney(copyFromId) : null;
            const today = new Date();
            const courtCount = src ? (parseInt(src.courtCount) || 2) : 2;
            return {
                editId,
                name: editId && src ? src.name : `${MONTHS[today.getMonth()]} Turnuvası`,
                date: editId && src ? src.date : isoDate(today),
                startTime: editId && src ? src.startTime : (src?.startTime || '18:00'),
                court: src ? facility(src) : '',
                courtCount,
                courtNames: Array.from({ length: courtCount }, (_, i) => src?.courtNames?.[i] || ''),
                sel: src ? src.activePlayerIds.slice() : latestRoster(),
                newName: '',
                editingPool: false,
            };
        }

        function rosterHint(n, courts) {
            const playing = Math.min(courts, Math.floor(n / 4)) * 4;
            const resting = n - playing;
            if (n < 4) return ['hint-err', 'En az 4 oyuncu seçmelisin.'];
            const idle = courts - Math.floor(n / 4);
            const extra = idle > 0 ? ` (${idle} saha boş kalır)` : '';
            if (resting === 0) return ['hint-ok', `${n} oyuncu · ${courts} saha → herkes her turda oynar${extra}.`];
            return ['hint-warn', `${n} oyuncu · ${courts} saha → her tur ${resting} kişi dinlenir${extra}. Dinlenen oyuncu bir sonraki tura öncelikli girer.`];
        }

        function renderForm() {
            if (form.editId && !getTourney(form.editId)) return notFound();
            const f = form;
            const [hintCls, hintText] = rosterHint(f.sel.length, f.courtCount);
            const pool = [...data.playersPool].sort((a, b) => a.name.localeCompare(b.name, 'tr', { sensitivity: 'base' }));

            const poolHtml = f.editingPool
                ? `<div class="stack">${pool.map(p => `
                    <div class="pool-row">
                        <input class="input grow" type="text" id="pn_${esc(p.id)}" data-action="rename-player" data-id="${esc(p.id)}" value="${esc(p.name)}" aria-label="${esc(p.name)} adını düzenle">
                        <button type="button" class="icon-btn" data-action="delete-player" data-id="${esc(p.id)}" aria-label="${esc(p.name)} oyuncusunu sil" style="color:var(--red)">${ICON.x}</button>
                    </div>`).join('')}</div>`
                : `<div class="chips">${pool.map(p => {
                    const on = f.sel.includes(p.id);
                    return `<button type="button" class="chip ${on ? 'on' : ''}" data-action="toggle-player" data-id="${esc(p.id)}" aria-pressed="${on}">${on ? ICON.check : ''}${esc(p.name)}</button>`;
                }).join('')}</div>`;

            return `
            <div class="wrap">
                <div class="row">
                    <a class="icon-btn" href="${f.editId ? `#/t/${esc(f.editId)}` : '#/'}" aria-label="Geri">${ICON.back}</a>
                    <h1 class="display" style="font-size:1.6rem;font-weight:800">${f.editId ? 'Turnuvayı Düzenle' : 'Yeni Turnuva'}</h1>
                </div>

                <div class="field">
                    <label class="label" for="f_name">Turnuva adı</label>
                    <input class="input" id="f_name" type="text" data-field="name" value="${esc(f.name)}">
                </div>
                <div class="grid2">
                    <div class="field">
                        <label class="label" for="f_date">Tarih</label>
                        <input class="input" id="f_date" type="date" data-field="date" value="${esc(f.date)}">
                    </div>
                    <div class="field">
                        <label class="label" for="f_time">Saat</label>
                        <input class="input" id="f_time" type="time" data-field="startTime" value="${esc(f.startTime)}">
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="f_court">Tesis (isteğe bağlı)</label>
                    <input class="input" id="f_court" type="text" data-field="court" value="${esc(f.court)}" placeholder="Tesis adı">
                </div>

                <div class="stack">
                    <div class="row" style="justify-content:space-between">
                        <span class="label">Saha sayısı</span>
                        <div class="stepper">
                            <button type="button" data-action="courts" data-d="-1" aria-label="Saha azalt">${ICON.minus}</button>
                            <span>${f.courtCount}</span>
                            <button type="button" data-action="courts" data-d="1" aria-label="Saha artır">${ICON.plus}</button>
                        </div>
                    </div>
                    <div class="grid2" style="gap:0.5rem">
                        ${f.courtNames.map((c, i) => `<input class="input input-dashed" type="text" id="f_court_${i}" data-court="${i}" value="${esc(c)}" placeholder="Kort ${i + 1}" aria-label="${i + 1}. saha adı">`).join('')}
                    </div>
                </div>

                <div class="stack">
                    <div class="row" style="justify-content:space-between">
                        <span class="label">Oyuncular</span>
                        <div class="row" style="gap:0.25rem">
                            <span style="font-size:0.8rem;font-weight:800;color:var(--lime)">${f.sel.length} seçili</span>
                            <button type="button" class="text-btn" data-action="edit-pool">${f.editingPool ? '· Bitti' : '· Düzenle'}</button>
                        </div>
                    </div>
                    ${f.editingPool ? '' : `<button type="button" class="chip-soft" data-action="use-last">${ICON.redo} Son turnuvanın kadrosu</button>`}
                    ${poolHtml}
                    <div class="row" style="gap:0.5rem">
                        <input class="input grow" type="text" id="f_new" data-field="newName" value="${esc(f.newName)}" placeholder="Yeni oyuncu ekle…" aria-label="Yeni oyuncu adı" enterkeyhint="done">
                        <button type="button" class="btn btn-sm btn-secondary" style="width:auto" data-action="add-player">Ekle</button>
                    </div>
                </div>

                <div class="hint ${hintCls}">${ICON.info}<span>${esc(hintText)}</span></div>

                ${f.sel.length >= 4
                    ? `<button type="button" class="btn btn-primary" data-action="submit-form">${f.editId ? 'Kaydet' : 'Turnuvayı Oluştur'}</button>`
                    : `<button type="button" class="btn btn-disabled" disabled>${f.editId ? 'Kaydet' : 'Turnuvayı Oluştur'}</button>`}
            </div>`;
        }

        async function submitForm() {
            const f = form;
            const name = f.name.trim();
            if (!name) { showToast('Turnuva adı boş olamaz.'); document.getElementById('f_name')?.focus(); return; }
            if (f.sel.length < 4) return;
            const fields = {
                name, date: f.date || '', startTime: f.startTime || '', time: legacyTimeString(f.date, f.startTime),
                court: f.court.trim(), courtCount: f.courtCount, courtNames: f.courtNames.map(s => s.trim()),
                activePlayerIds: f.sel.filter(id => data.playersPool.some(p => p.id === id)),
            };
            let id = f.editId;
            if (id) {
                Object.assign(getTourney(id), fields);
            } else {
                id = `t_${Date.now()}`;
                data.tournaments.push({ id, ...fields, rounds: [], createdAt: Date.now(), isFinished: false });
            }
            data.currentTournamentId = id;
            await save();
            location.hash = `#/t/${id}`;
        }

        // ==========================================
        // 3/4 · Turnuva ekranı (canlı skor veya özet)
        // ==========================================
        function notFound() {
            return `<div class="wrap"><div class="empty">Turnuva bulunamadı.</div><a class="btn btn-secondary" href="#/">Turnuvalara dön</a></div>`;
        }

        function boardHtml(t) {
            const rows = standings(t);
            return rows.map((p, i) => `
                <div class="board-row">
                    <span class="rank ${i < 3 ? `rank-${i + 1}` : ''}">${i + 1}</span>
                    <span class="board-name">${esc(p.name)}</span>
                    ${p.delta > 0 && t.rounds.length ? `<span class="delta">+${p.delta}</span>` : ''}
                    <span class="board-pts">${p.score} Puan</span>
                </div>`).join('');
        }

        const teamNames = (p, q) => `${esc(playerName(p.id, p.name))} · ${esc(playerName(q.id, q.name))}`;

        function matchCard(t, ri, mi) {
            const m = t.rounds[ri].matches[mi];
            const court = esc(m.court || `Kort ${mi + 1}`);
            const team = (side, p, q, score) => `
                <div class="team" id="team_${ri}_${mi}_${side}">
                    <div class="grow stack" style="gap:0.1rem">
                        <span class="team-names">${teamNames(p, q)}</span>
                        <span class="team-won-label">Kazandı · +5 bonus</span>
                    </div>
                    <input class="score" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"
                        id="s_${ri}_${mi}_${side}" data-r="${ri}" data-m="${mi}" data-s="${side}"
                        value="${score ?? ''}" placeholder="–" aria-label="${court} ${teamNames(p, q).replace(' · ', ' ve ')} skoru">
                </div>`;
            return `
                <div class="match">
                    <span class="court">${court}</span>
                    ${team(1, m.t1p1, m.t1p2, m.score1)}
                    ${team(2, m.t2p1, m.t2p2, m.score2)}
                    <span class="match-note" id="note_${ri}_${mi}"></span>
                </div>`;
        }

        // Kart görünümünü (kazanan, hata, tie-break) modelden güncelle
        function paintMatch(t, ri, mi) {
            const m = t.rounds[ri]?.matches[mi];
            const t1 = document.getElementById(`team_${ri}_${mi}_1`);
            const t2 = document.getElementById(`team_${ri}_${mi}_2`);
            const note = document.getElementById(`note_${ri}_${mi}`);
            if (!m || !t1 || !t2 || !note) return;
            const res = matchResult(m);
            const ok = res && !res.invalid;
            t1.classList.toggle('won', !!ok && res.a === 24);
            t1.classList.toggle('lost', !!ok && res.a !== 24);
            t2.classList.toggle('won', !!ok && res.b === 24);
            t2.classList.toggle('lost', !!ok && res.b !== 24);
            note.className = 'match-note';
            note.textContent = '';
            if (res && res.invalid) {
                note.classList.add('err');
                note.textContent = res.a === 24 ? 'Bir takım 24 almalı, ikisi birden alamaz.' : 'Maç bir takım 24 olunca biter.';
            } else if (ok && Math.min(res.a, res.b) === 23) {
                note.classList.add('tb');
                note.textContent = 'Tie-break ile kazanıldı (23-23 → 24-23).';
            }
        }

        function roundFooterHtml(t) {
            const last = t.rounds[t.rounds.length - 1];
            const nextNo = t.rounds.length + 1;
            return roundComplete(last)
                ? `<button type="button" class="btn btn-primary" data-action="next-round">${nextNo}. Turu Oluştur ${ICON.next}</button>`
                : `<button type="button" class="btn btn-disabled" disabled>${nextNo}. Tur için skorları gir</button>`;
        }

        const doneText = t => {
            const last = t.rounds[t.rounds.length - 1];
            const done = last.matches.filter(m => { const r = matchResult(m); return r && !r.invalid; }).length;
            return `${done}/${last.matches.length} maç girildi`;
        };

        function restingNames(t, round) {
            const playing = new Set(round.matches.flatMap(m => [m.t1p1.id, m.t1p2.id, m.t2p1.id, m.t2p2.id]));
            return t.activePlayerIds.filter(id => !playing.has(id)).map(id => playerName(id));
        }

        function headerHtml(t) {
            return `
                <div class="row">
                    <a class="icon-btn" href="#/" aria-label="Turnuvalar">${ICON.back}</a>
                    <div class="grow stack" style="gap:0.1rem">
                        <h1 class="display" style="font-size:1.4rem;font-weight:800">${esc(t.name)}</h1>
                        <span class="sub">${esc([fmtWhen(t), `${parseInt(t.courtCount) || 2} saha`, facility(t)].filter(Boolean).join(' · '))}</span>
                    </div>
                    ${statusPill()}
                    <div class="menu">
                        <button type="button" class="icon-btn" data-action="menu" aria-label="Turnuva menüsü" aria-expanded="${menuOpen}">${ICON.dots}</button>
                        ${menuOpen ? `
                        <div class="menu-pop">
                            <a href="#/duzenle/${esc(t.id)}">Turnuvayı düzenle</a>
                            ${t.isFinished
                                ? '<button type="button" data-action="reopen">Turnuvaya devam et</button>'
                                : '<button type="button" data-action="finish">Turnuvayı bitir</button>'}
                            <a href="#/yeni/kopya/${esc(t.id)}">Aynı kadroyla yeni turnuva</a>
                            <button type="button" class="danger" data-action="delete-tourney">Turnuvayı sil</button>
                        </div>` : ''}
                    </div>
                </div>`;
        }

        const rulesHtml = `
            <details class="rules">
                <summary>Oyun kuralları</summary>
                Maçlar <strong>24 sayıda</strong> biter. <strong>23-23</strong> olursa tie-break oynanır ve sisteme <strong>24-23</strong> girilir.
                Her oyuncu takımının aldığı sayı kadar puan kazanır; kazanan takımın her oyuncusu <strong>+5 bonus</strong> alır (toplam 29).
                Sonraki turda puan sırasına göre <strong>1.+8. vs 2.+7.</strong> ve <strong>3.+6. vs 4.+5.</strong> eşleşir.
            </details>`;

        function renderTourney() {
            const t = getTourney(view.id);
            if (!t) return notFound();
            return t.isFinished ? renderSummary(t) : renderLive(t);
        }

        function renderLive(t) {
            if (!t.rounds.length) {
                const [hintCls, hintText] = rosterHint(t.activePlayerIds.length, parseInt(t.courtCount) || 2);
                return `
                <div class="wrap">
                    ${headerHtml(t)}
                    <section class="stack">
                        <h2 class="section-title">KADRO</h2>
                        <div class="tags">${t.activePlayerIds.map(id => `<span class="tag">${esc(playerName(id))}</span>`).join('')}</div>
                    </section>
                    <div class="hint ${hintCls}">${ICON.info}<span>${esc(hintText)}</span></div>
                    ${t.activePlayerIds.length >= 4
                        ? `<button type="button" class="btn btn-primary" data-action="next-round">1. Turu Oluştur ${ICON.next}</button>`
                        : `<a class="btn btn-secondary" href="#/duzenle/${esc(t.id)}">Oyuncu ekle</a>`}
                    <p class="sub center" style="margin:0">İlk turun eşleşmeleri rastgele yapılır.</p>
                    ${rulesHtml}
                </div>`;
            }

            const ri = t.rounds.length - 1;
            const round = t.rounds[ri];
            const resting = restingNames(t, round);
            const pastRounds = t.rounds.slice(0, ri).map((r, i) => ({ r, i })).reverse();

            return `
            <div class="wrap">
                ${headerHtml(t)}
                <section class="stack">
                    <div class="row" style="justify-content:space-between;align-items:baseline">
                        <h2 class="section-title">SIRALAMA</h2>
                        <span class="sub">bu turdaki puanlar dahil</span>
                    </div>
                    <div class="board" id="board">${boardHtml(t)}</div>
                </section>

                <section class="stack" id="current-round" style="gap:0.75rem">
                    <div class="row" style="justify-content:space-between">
                        <h2 class="display" style="font-size:1.25rem;font-weight:800">${ri + 1}. Tur</h2>
                        <span class="sub" id="done-count" style="font-weight:600">${doneText(t)}</span>
                    </div>
                    ${round.matches.map((_, mi) => matchCard(t, ri, mi)).join('')}
                    ${resting.length ? `<span class="resting">Bu tur dinlenen: <strong style="color:var(--text-2)">${esc(resting.join(', '))}</strong></span>` : ''}
                    <span class="sub center">Kaybedenin skorunu yazman yeterli, kazanan otomatik 24 olur.${isOfflineMode ? '' : ' Skorlar anında herkese görünür.'}</span>
                </section>

                <div id="round-footer">${roundFooterHtml(t)}</div>

                ${pastRounds.length ? `
                <section class="stack">
                    <h2 class="section-title">ÖNCEKİ TURLAR</h2>
                    ${pastRounds.map(({ r, i }) => `
                        <details class="round" data-round="${i}" ${openRounds.has(i) ? 'open' : ''}>
                            <summary><span>${i + 1}. Tur</span><span class="muted">${r.matches.map(m => `${m.score1 ?? '–'}-${m.score2 ?? '–'}`).join(' · ')} ${ICON.down}</span></summary>
                            <div class="round-body">${r.matches.map((_, mi) => matchCard(t, i, mi)).join('')}</div>
                        </details>`).join('')}
                </section>` : ''}
                <button type="button" class="link-danger" data-action="undo-round">Son turu geri al</button>
                ${rulesHtml}
            </div>`;
        }

        function renderSummary(t) {
            const rows = standings(t);
            const top = rows.slice(0, 3);
            const podiumCol = (p, place) => p ? `
                <div class="podium-col p${place}">
                    ${place === 1 ? `<span style="color:var(--gold)">${ICON.trophy}</span>` : ''}
                    <span class="podium-name">${esc(p.name)}</span>
                    <div class="podium-block"><span class="display">${place}</span><small>${p.score} puan</small></div>
                </div>` : '<div></div>';
            const line = m => {
                const res = matchResult(m);
                const ok = res && !res.invalid;
                const c1 = ok && res.a === 24 ? 'w' : 'x', c2 = ok && res.b === 24 ? 'w' : 'x';
                return `<div class="result-line"><span class="l ${c1}">${teamNames(m.t1p1, m.t1p2).replace(' · ', ' + ')}</span><span class="result-score">${m.score1 ?? '–'}-${m.score2 ?? '–'}</span><span class="${c2}">${teamNames(m.t2p1, m.t2p2).replace(' · ', ' + ')}</span></div>`;
            };
            return `
            <div class="wrap">
                ${headerHtml(t)}
                <span class="pill pill-grey" style="align-self:flex-start">Turnuva bitti · ${t.rounds.length} tur</span>
                ${rows.length && t.rounds.length ? `
                <div class="podium">${podiumCol(top[1], 2)}${podiumCol(top[0], 1)}${podiumCol(top[2], 3)}</div>
                ${rows.length > 3 ? `<div class="board">${rows.slice(3).map((p, i) => `
                    <div class="board-row"><span class="rank">${i + 4}</span><span class="board-name">${esc(p.name)}</span><span class="board-pts" style="color:var(--lime)">${p.score} Puan</span></div>`).join('')}</div>` : ''}
                <section class="stack">
                    <h2 class="section-title">MAÇLAR</h2>
                    ${t.rounds.map((r, i) => `<div class="result-round"><span class="result-round-title">${i + 1}. TUR</span>${r.matches.map(line).join('')}</div>`).join('')}
                </section>` : '<div class="empty">Bu turnuvada hiç maç oynanmadı.</div>'}
                <a class="btn btn-sm btn-secondary" href="#/yeni/kopya/${esc(t.id)}">${ICON.copy} Aynı kadroyla yeni turnuva</a>
                <div class="grid2">
                    <button type="button" class="btn btn-sm btn-ghost" data-action="share">Sonuçları paylaş</button>
                    <button type="button" class="btn btn-sm btn-danger" data-action="delete-tourney">Turnuvayı sil</button>
                </div>
            </div>`;
        }

        // Skor girişinde tüm sayfayı çizmeden ilgili parçaları güncelle
        function refreshLiveParts(t) {
            document.querySelectorAll('.score').forEach(inp => {
                const m = t.rounds[+inp.dataset.r]?.matches[+inp.dataset.m];
                if (!m) return;
                if (inp !== document.activeElement) inp.value = (inp.dataset.s === '1' ? m.score1 : m.score2) ?? '';
            });
            t.rounds.forEach((r, ri) => r.matches.forEach((_, mi) => paintMatch(t, ri, mi)));
            const board = document.getElementById('board');
            if (board) board.innerHTML = boardHtml(t);
            const footer = document.getElementById('round-footer');
            if (footer) footer.innerHTML = roundFooterHtml(t);
            const dc = document.getElementById('done-count');
            if (dc) dc.textContent = doneText(t);
        }

        function paintAll() {
            if (view.name !== 'tourney' || !data) return;
            const t = getTourney(view.id);
            if (t && !t.isFinished) t.rounds.forEach((r, ri) => r.matches.forEach((_, mi) => paintMatch(t, ri, mi)));
        }

        function onScoreInput(inp) {
            const t = getTourney(view.id);
            const ri = +inp.dataset.r, mi = +inp.dataset.m, side = inp.dataset.s;
            const m = t?.rounds[ri]?.matches[mi];
            if (!m) return;
            const digits = inp.value.replace(/\D/g, '').slice(0, 2);
            const v = digits === '' ? null : Math.min(24, parseInt(digits, 10));
            if (digits !== '' && parseInt(digits, 10) > 24) showToast('Uzatmada bile en fazla 24 girilebilir (24-23).');
            inp.value = v ?? '';
            const own = side === '1' ? 'score1' : 'score2';
            const other = side === '1' ? 'score2' : 'score1';
            m[own] = v;
            // Kaybedenin skoru girilince kazanan otomatik 24
            if (v !== null && v < 24) m[other] = 24;
            else if (v === 24 && num(m[other]) === 24) m[other] = null;
            refreshLiveParts(t);
            save();
        }

        function shareText(t) {
            const rows = standings(t);
            const medal = ['🥇', '🥈', '🥉'];
            return `🎾 *${t.name}* – Sonuçlar\n${fmtWhen(t)}\n\n` +
                rows.map((p, i) => `${medal[i] || `${i + 1}.`} ${p.name} – ${p.score} puan`).join('\n') +
                `\n\n${location.origin}${location.pathname}`;
        }

        // ==========================================
        // Olay yönetimi (tek noktadan)
        // ==========================================
        $app.addEventListener('click', async e => {
            const el = e.target.closest('[data-action]');
            if (!el) {
                if (menuOpen && !e.target.closest('.menu')) { menuOpen = false; render(); paintAll(); }
                return;
            }
            const action = el.dataset.action;
            const t = view.name === 'tourney' ? getTourney(view.id) : null;

            switch (action) {
                case 'toggle-large':
                    isEasyReadingActive = !isEasyReadingActive;
                    localStorage.setItem('padel_easy_reading_mode', isEasyReadingActive);
                    applyEasyReadingMode(isEasyReadingActive);
                    render();
                    break;

                // --- Form ---
                case 'courts':
                    form.courtCount = Math.max(1, Math.min(10, form.courtCount + parseInt(el.dataset.d)));
                    form.courtNames = Array.from({ length: form.courtCount }, (_, i) => form.courtNames[i] || '');
                    render();
                    break;
                case 'toggle-player': {
                    const id = el.dataset.id;
                    form.sel = form.sel.includes(id) ? form.sel.filter(x => x !== id) : [...form.sel, id];
                    render();
                    break;
                }
                case 'use-last':
                    form.sel = latestRoster();
                    render();
                    break;
                case 'edit-pool':
                    form.editingPool = !form.editingPool;
                    render();
                    break;
                case 'add-player':
                    addPlayerFromForm();
                    break;
                case 'delete-player': {
                    const id = el.dataset.id;
                    const ok = await askConfirm('Oyuncu silinsin mi?', `${playerName(id)} oyuncu havuzundan ve tüm turnuva kadrolarından çıkarılacak. Oynanmış maçlardaki skorlar korunur.`, 'Sil', true);
                    if (!ok) return;
                    data.playersPool = data.playersPool.filter(p => p.id !== id);
                    data.tournaments.forEach(tr => tr.activePlayerIds = tr.activePlayerIds.filter(x => x !== id));
                    form.sel = form.sel.filter(x => x !== id);
                    await save();
                    render();
                    break;
                }
                case 'submit-form':
                    submitForm();
                    break;

                // --- Turnuva ---
                case 'menu':
                    menuOpen = !menuOpen;
                    render();
                    paintAll();
                    break;
                case 'next-round': {
                    if (!t) return;
                    if (t.activePlayerIds.length < 4) { showToast('En az 4 oyuncu gerekli.'); return; }
                    if (t.rounds.length && !roundComplete(t.rounds[t.rounds.length - 1])) { showToast('Önce bu turun tüm skorlarını gir.'); return; }
                    generateRound(t);
                    await save();
                    render();
                    paintAll();
                    document.getElementById('current-round')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    break;
                }
                case 'undo-round': {
                    if (!t || !t.rounds.length) return;
                    const ok = await askConfirm('Son tur silinsin mi?', `${t.rounds.length}. tur ve skorları tamamen silinecek. Önceki bir turu düzeltmek için de kullanabilirsin.`, 'Evet, sil', true);
                    if (!ok) return;
                    t.rounds.pop();
                    await save();
                    render();
                    paintAll();
                    break;
                }
                case 'finish': {
                    menuOpen = false;
                    const ok = await askConfirm('Turnuva bitsin mi?', 'Turnuva geçmiş turnuvalara taşınır ve sonuçlar görünür. İstersen sonra devam edebilirsin.', 'Bitir');
                    if (ok) { t.isFinished = true; await save(); }
                    render();
                    paintAll();
                    break;
                }
                case 'reopen':
                    menuOpen = false;
                    t.isFinished = false;
                    await save();
                    render();
                    paintAll();
                    break;
                case 'delete-tourney': {
                    menuOpen = false;
                    const ok = await askConfirm('Turnuva silinsin mi?', `"${t.name}" ve tüm maç geçmişi silinecek. Bu işlem geri alınamaz.`, 'Sil', true);
                    if (!ok) { render(); paintAll(); return; }
                    data.tournaments = data.tournaments.filter(x => x.id !== t.id);
                    if (data.currentTournamentId === t.id) data.currentTournamentId = data.tournaments[0]?.id || '';
                    await save();
                    location.hash = '#/';
                    break;
                }
                case 'share': {
                    const text = shareText(t);
                    try {
                        if (navigator.share) await navigator.share({ text });
                        else { await navigator.clipboard.writeText(text); showToast('Sonuçlar panoya kopyalandı.'); }
                    } catch (err) { /* paylaşım iptal edildi */ }
                    break;
                }
            }
        });

        function addPlayerFromForm() {
            const name = form.newName.trim();
            if (!name) return;
            const existing = data.playersPool.find(p => p.name.toLocaleLowerCase('tr') === name.toLocaleLowerCase('tr'));
            const id = existing ? existing.id : `p_${Date.now()}`;
            if (!existing) data.playersPool.push({ id, name });
            if (!form.sel.includes(id)) form.sel.push(id);
            form.newName = '';
            save();
            render();
            document.getElementById('f_new')?.focus();
        }

        $app.addEventListener('input', e => {
            const el = e.target;
            if (el.classList.contains('score')) { onScoreInput(el); return; }
            if (!form || view.name !== 'form') return;
            if (el.dataset.field) form[el.dataset.field] = el.value;
            if (el.dataset.court !== undefined) form.courtNames[+el.dataset.court] = el.value;
        });

        $app.addEventListener('change', e => {
            const el = e.target;
            if (el.dataset.action === 'rename-player') {
                const name = el.value.trim();
                const p = data.playersPool.find(x => x.id === el.dataset.id);
                if (p && name) { p.name = name; save(); }
                else if (p) el.value = p.name;
            }
        });

        $app.addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.target.id === 'f_new') { e.preventDefault(); addPlayerFromForm(); }
            if (e.key === 'Escape' && menuOpen) { menuOpen = false; render(); paintAll(); }
        });

        $app.addEventListener('toggle', e => {
            const d = e.target;
            if (d.matches && d.matches('details.round')) {
                const i = +d.dataset.round;
                if (d.open) openRounds.add(i); else openRounds.delete(i);
            }
        }, true);

        window.addEventListener('hashchange', route);

        // ==========================================
        // Veri: yerel yedek + Firebase canlı senkron
        // ==========================================
        function onData(newData) {
            data = migrateOldData(newData);
            backupDataLocally(data);
            const ae = document.activeElement;
            const t = view.name === 'tourney' ? getTourney(view.id) : null;
            // Skor yazılırken gelen güncelleme odaktaki kutuyu silmesin
            const scoreBoxes = document.querySelectorAll('.score').length;
            const modelBoxes = t && !t.isFinished ? t.rounds.reduce((n, r) => n + r.matches.length * 2, 0) : -1;
            if (ae && ae.classList.contains('score') && scoreBoxes === modelBoxes && !menuOpen) { refreshLiveParts(t); return; }
            // Form doldurulurken ekranı yeniden çizme
            if (view.name === 'form' && ae && ae.tagName === 'INPUT') return;
            render();
            paintAll();
        }

        function goOffline() {
            isOfflineMode = true;
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            render();
            paintAll();
        }

        function listenToTournament() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(tourneyDocRef, docSnap => {
                isOfflineMode = false;
                if (docSnap.exists()) {
                    onData(docSnap.data());
                } else {
                    // İlk bağlantıda bu cihazdaki yerel turnuvaları buluta taşı
                    const localData = localStorage.getItem('padel_mexicano_backup');
                    data = migrateOldData(localData ? JSON.parse(localData) : null);
                    setDoc(tourneyDocRef, data);
                    render();
                    paintAll();
                }
            }, error => {
                console.error("DB dinleme hatası, yerel moda geçiliyor:", error);
                goOffline();
            });
        }

        async function initAuth() {
            try {
                if (Object.keys(firebaseConfig).length === 0) throw new Error("Firebase Config Yok");
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                tourneyDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'mexicano', 'state');

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, user => { if (user) listenToTournament(); });
            } catch (error) {
                console.warn("Bağlantı kurulamadı, yerel moda geçiliyor.", error);
                goOffline();
            }
        }

        window.addEventListener('offline', () => { showToast("İnternet bağlantısı koptu, yerel modda devam ediliyor."); goOffline(); });
        window.addEventListener('online', () => { showToast("İnternet geldi, canlı sisteme bağlanılıyor…"); if (tourneyDocRef) listenToTournament(); });

        // Önce yerel yedekle hemen çiz, sonra buluta bağlan
        {
            const localData = localStorage.getItem('padel_mexicano_backup');
            data = migrateOldData(localData ? JSON.parse(localData) : null);
        }
        route();
        initAuth();
    </script>
</body>
</html>
